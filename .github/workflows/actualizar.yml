name: Actualizar observatorio

# El día 25 de cada mes, a las 06:00 UTC. GitHub puede retrasar los cron unos
# minutos cuando hay cola; no importa, el dato es mensual.
on:
  schedule:
    - cron: '0 6 25 * *'
  workflow_dispatch:
    inputs:
      anios:
        description: 'Años a redescargar (coma). Vacío = solo el ejercicio en curso.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: actualizar-observatorio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Años a refrescar
        id: anios
        run: |
          if [ -n "${{ inputs.anios }}" ]; then
            echo "years=${{ inputs.anios }}" >> "$GITHUB_OUTPUT"
          else
            echo "years=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          fi

      # Solo el ejercicio en curso: los años cerrados se reutilizan desde
      # _raw/cache/, que está versionado. Sin esto habría que bajar 11 GB.
      - name: Descargar de la PLACSP
        env:
          PLACSP_YEARS: ${{ steps.anios.outputs.years }}
        run: python _scripts/download_placsp.py

      - name: Actualizar códigos CODICE
        run: python _scripts/codigos.py
        continue-on-error: true

      - name: Extraer los expedientes de Marbella
        run: python _scripts/extraer_marbella.py

      - name: Reconstruir el panel
        run: python _scripts/build_data.py

      - name: Comprobar que el panel pinta
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python _scripts/verificar.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add observatorio/data/data.js csv contratos_marbella.json _raw/cache
          if git diff --cached --quiet; then
            echo 'La Plataforma no ha publicado nada nuevo: no se toca el repositorio.'
          else
            git commit -m "Actualización automática de $(date -u +%Y-%m-%d) desde la PLACSP"
            git push
          fi
