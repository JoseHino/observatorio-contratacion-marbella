name: Actualizar observatorio

# El día 25 de cada mes, a las 06:00 UTC. GitHub puede retrasar los cron unos
# minutos cuando hay cola; no importa, el dato es mensual.
on:
  schedule:
    - cron: '0 6 25 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-observatorio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install --quiet pdfplumber playwright
          playwright install --with-deps chromium

      # Lee la pestaña "Documentos" del perfil del contratante y descarga lo
      # que aún no esté en _raw/perfil/. Los PDF ya descargados no se vuelven
      # a pedir, así que una pasada normal solo trae lo nuevo.
      - name: Descargar los documentos del perfil del contratante
        run: python _scripts/descargar_perfil.py

      # Si el scraper no encuentra la pestaña, deja captura y HTML: sin esto
      # no hay forma de saber qué le está sirviendo el portal al runner.
      - name: Guardar el rastro del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fallo-scraper
          path: |
            _raw/perfil/_fallo.png
            _raw/perfil/_fallo.html
          if-no-files-found: ignore

      - name: Extraer las tablas de los PDF
        run: python _scripts/extraer_listados.py

      - name: Reconstruir el panel
        run: python _scripts/build_data.py

      # Que la página cargue no significa que haya datos: se exige lienzo en
      # todas las gráficas, en claro y en oscuro. Si falla, no se publica.
      - name: Comprobar que el panel pinta
        run: python _scripts/verificar.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add observatorio/data/data.js csv listados_marbella.json _raw/perfil
          if git diff --cached --quiet; then
            echo 'El Ayuntamiento no ha publicado nada nuevo: no se toca el repositorio.'
          else
            git commit -m "Actualización automática de $(date -u +%Y-%m-%d) desde el perfil del contratante"
            git push
          fi
