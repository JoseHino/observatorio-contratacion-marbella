<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatorio de Transparencia en la Contratación · Marbella</title>
<meta name="description" content="Contratos mayores y menores del Ayuntamiento de Marbella publicados en la Plataforma de Contratación del Sector Público, por año, tipo, procedimiento, materia y adjudicatario, con buscador de expedientes.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2337A0B4'/%3E%3Cpath d='M5 6v12h13' stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round'/%3E%3Cpath d='m8 14 3-3 3 3 4-6' stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;650&display=swap" rel="stylesheet">

<!-- Kit: no se toca por observatorio -->
<link rel="stylesheet" href="assets/obs.css">

<!-- Ajustes de ESTE observatorio: marca y el bloque libre del buscador. -->
<style>
  :root { --brand: #37A0B4; --brand-ink: #22697A; --brand-soft: #E6F4F7; }
  :root[data-theme="dark"] { --brand: #4FB8CC; --brand-ink: #7FD0DF; --brand-soft: #16323A; }

  /* --- Buscador de expedientes (bloque libre de la sección) --------------- */
  .bs-filtros {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    padding: 14px; margin-bottom: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow);
  }
  .bs-buscar { flex: 1 1 320px; display: block; }
  .bs-buscar input {
    width: 100%; min-height: 38px; font-size: 14px; font-family: var(--font);
  }
  .bs-filtros .obs-card-ctrl { flex: 0 0 auto; }
  .bs-resumen { margin: 0 0 12px; padding: 0 2px; font-size: 14px; color: var(--ink-2); }
  .bs-resumen b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .bs-tabla-wrap {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow); overflow-x: auto;
  }
  /* El kit alinea a la derecha y sin salto: correcto para una tabla de cifras,
     no para un listado de expedientes. Se corrige solo aquí. */
  .bs-tabla { width: 100%; table-layout: fixed; }
  .bs-tabla th, .bs-tabla td {
    vertical-align: top; text-align: left; white-space: normal; overflow-wrap: anywhere;
  }
  .bs-tabla col.c-anio { width: 66px; }
  .bs-tabla col.c-clase { width: 92px; }
  .bs-tabla col.c-exp { width: 130px; }
  .bs-tabla col.c-adj { width: 22%; }
  .bs-tabla col.c-imp { width: 130px; }
  .bs-tabla .bs-anio { font-variant-numeric: tabular-nums; }
  .bs-tabla th.bs-num, .bs-tabla td.bs-num {
    text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  /* El objeto se recorta a dos líneas hasta que se abre la ficha. */
  .bs-row:not(.abierta) .bs-obj {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bs-mut { color: var(--ink-mut); }

  .bs-row { cursor: pointer; }
  .bs-row:hover { background: var(--surface-2); }
  .bs-row.abierta { background: var(--brand-soft); }
  .bs-row.abierta .bs-obj { white-space: normal; }

  .bs-detalle { padding: 4px 2px 10px; }
  .bs-detalle dl {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px 20px; margin: 0 0 12px;
  }
  .bs-detalle dl > div { min-width: 0; }
  .bs-detalle dt { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-mut); }
  .bs-detalle dd {
    margin: 2px 0 0; font-size: 13px; color: var(--ink);
    white-space: normal; overflow-wrap: anywhere;
  }
  .bs-objeto { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: var(--ink-2); max-width: 78ch; }

  .bs-mas { display: flex; justify-content: center; padding: 14px 0 4px; }

  @media print { .bs-filtros, .bs-mas { display: none; } }
</style>
</head>
<body>

<div id="obs-app"></div>

<!-- Librería de gráficas -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<!-- Kit -->
<script src="assets/obs-charts.js"></script>
<script src="assets/obs-ui.js"></script>
<!-- Datos (los escribe _scripts/build_data.py) -->
<script src="data/data.js"></script>
<!-- Declaración de ESTE observatorio -->
<script src="app.js"></script>

</body>
</html>
